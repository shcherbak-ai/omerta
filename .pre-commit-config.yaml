# A hook without `stages` runs at every installed stage. At commit-msg it is
# given the message file, so a hook without a file filter (uv lock --check)
# would run a second time for each commit.
default_stages: [pre-commit]

# Every hook runs a tool of uv.lock or of package-lock.json, none a repository
# that pre-commit installs: it would resolve the dependencies of the repository
# afresh, past the cooldown of the lockfiles and their advisory check.
repos:
  # These run from the project environment: uv.lock is their only version pin.
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run end-of-file-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: uv run check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: uv run check-toml
        language: system
        types: [toml]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        require_serial: true
      - id: ty
        name: ty
        entry: uv run ty check src/
        language: system
        types: [python]
        pass_filenames: false
      # Imports against declared dependencies, so a change to either runs it.
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        types_or: [python, toml]
        pass_filenames: false
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
      # New releases stay out of the lockfiles for a week, and no locked
      # version, nor the uv that the workflows pin, has an advisory at osv.dev,
      # but for its ACCEPTED_ADVISORIES. At each commit, as an advisory comes
      # out without a change to a file. CI skips it (SKIP), where its result
      # would depend on the day, not on the commit. Verbose, for its warnings,
      # which do not fail it.
      - id: advisories
        name: release cooldown, and no advisories of locked versions
        entry: uv run python scripts/check_advisories.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
      # The licences of the package's own dependencies, of which LICENSES.md
      # is the report. Only where a commit changes them, as licenseal asks PyPI
      # for each package; CI's run over all files has them, at every push, so
      # a release waits for it.
      - id: licenseal
        name: licenseal
        entry: uv run licenseal check --no-dev
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: interrogate
        name: interrogate
        entry: uv run interrogate src/
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false
      # omerta itself, from the source, on the staged files: symbolic links too,
      # which pre-commit tags `symlink` only, never `file`.
      - id: omerta
        name: omerta
        entry: uv run omerta check
        language: system
        types: []
        types_or: [file, symlink]
      - id: commitizen
        name: commitizen check
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]

  # These run on the Node that npm needs for the development tools
  # (package.json): markdownlint from node_modules (npm ci), with
  # package-lock.json its only version pin, and the tests of the Claude Code
  # hook that keeps the agents' browser files in one folder, and of the
  # settings that start it, with Node's own runner.
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: node node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs
        language: system
        types: [markdown]
      - id: claude-hooks
        name: claude hooks tests
        entry: node --test .claude/hooks/playwright-files.test.mjs
        language: system
        files: ^\.claude/(hooks/|settings\.json$)
        pass_filenames: false
