name: Latest dependencies

# The package with the newest release of each dependency in place of its exact
# pin: users get the pins, so this warns ahead of the next one, as what is
# searched for depends on the parser of python-dotenv. The cooldown of
# `[tool.uv] exclude-newer` holds here too. On the one Python of
# .python-version, not the matrix. And that omerta, at the pins, installs from
# wheels on every platform and Python it supports.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.4"

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/../latest-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python from .python-version
        run: uv python install

      # The test tools at the versions of uv.lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Check that every platform installs from wheels
        run: uv run --no-sync python scripts/check_wheels.py

      # The package itself, built and installed as a user's install has it,
      # with overrides that put the newest release of each dependency in place
      # of its pin (so `uv pip check`, which holds the pins, is not run).
      - name: Install the package with the newest dependencies
        run: |
          printf 'hyperscan\npython-dotenv\n' > "$RUNNER_TEMP/newest.txt"
          uv pip install --python "$UV_PROJECT_ENVIRONMENT" --upgrade --override "$RUNNER_TEMP/newest.txt" .
          uv pip show --python "$UV_PROJECT_ENVIRONMENT" hyperscan python-dotenv

      - name: Run tests
        run: uv run --no-sync pytest -n auto
