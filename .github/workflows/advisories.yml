name: Advisories

# The advisories of the package's own dependencies, daily: they are pinned
# exactly, so users keep an affected version until a release of omerta, and
# an advisory comes out without a change to a file, while the hook runs only
# at a commit. Only those (--runtime), so that a failure always calls for a
# release: the rest of the check is for development, and stays with the hook.
# On main, where GitHub runs a schedule.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# The checkout leaves no token in .git/config (persist-credentials: false):
# the steps after it run the code of the dependencies.
permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  # The SHA-256 of its uv-x86_64-unknown-linux-gnu.tar.gz, which setup-uv
  # checks the download against (see ci.yml).
  UV_LINUX_X64_SHA256: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_LINUX_X64_SHA256 }}

      - name: Set up Python from .python-version
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Check the pinned dependencies against osv.dev
        run: uv run python scripts/check_advisories.py --runtime
