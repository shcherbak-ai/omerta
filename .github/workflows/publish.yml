name: Publish

# After every CI run: the gate below publishes only a commit of main that a v*
# tag points at. A release starts two runs, that of the push to main and that
# of the tag, and either can publish it, so a tag pushed after main's run has
# finished is still released. No branch filter: to one, a tag's run has the
# tag's name for its branch, and `branches: [main]` would leave it out. Once
# PyPI has the release, the last job makes its GitHub release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

# Checkouts leave no token in .git/config (persist-credentials: false): the
# build's smoke test runs the code of the dependencies.
permissions:
  contents: read

env:
  UV_VERSION: "0.13.4"
  # The SHA-256 of its uv-x86_64-unknown-linux-gnu.tar.gz, which setup-uv
  # checks the download against (see ci.yml): uv is also the build backend.
  UV_LINUX_X64_SHA256: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"

jobs:
  publish-gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify v* tag on main
        id: check
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Check for an actual v* tag pointing at this commit
          TAG=$(git tag --points-at "$SHA" | grep '^v' | head -n1)
          if [ -z "$TAG" ]; then
            echo "::notice::No v* tag at $SHA — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Verify the tagged commit is on main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::notice::Tag $TAG is not on main — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing $TAG ($SHA)"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: [publish-gate]
    if: needs.publish-gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # setup-uv's cache is off in a workflow_run, and uv build uses uv's own
      # backend: the build downloads nothing but uv and Python.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_LINUX_X64_SHA256 }}

      - name: Set up Python from .python-version
        run: uv python install

      # The notes of the GitHub release: the version's section of the
      # changelog. Taken here, before anything is published, so that a version
      # without one stops the release before it reaches PyPI; and written
      # outside the checkout, so that the build sees the tagged commit only.
      - name: Write the release notes
        env:
          TAG: ${{ needs.publish-gate.outputs.tag }}
        run: uv run --no-project python scripts/release_notes.py "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build sdist and wheel
        run: uv build

      # Uploaded before the smoke test, the first step to run code of the
      # dependencies, so that what is published is what was built. The
      # publish job still waits for the test.
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

      # Smoke-test the built wheel: install it into a fresh venv and run the
      # command's --version, then check a repository from outside the
      # checkout: it finds the key, by its variable, and never prints it. Its
      # dependencies are the versions of uv.lock, which the tests ran on,
      # checked by their hashes: none is resolved afresh.
      - name: Verify wheel install
        run: |
          uv export --locked --no-default-groups --no-emit-project --output-file /tmp/requirements.txt
          uv venv /tmp/wheel-verify
          uv pip install --python /tmp/wheel-verify/bin/python --require-hashes -r /tmp/requirements.txt
          uv pip install --python /tmp/wheel-verify/bin/python --no-deps dist/omerta-*.whl
          uv pip check --python /tmp/wheel-verify/bin/python
          /tmp/wheel-verify/bin/omerta --version
          mkdir /tmp/smoke && cd /tmp/smoke && git init -q
          printf 'API_KEY=sk-smoke-0123456789abcdef\n' > .env
          printf 'key = "sk-smoke-0123456789abcdef"\n' > app.py && git add app.py
          set +e; /tmp/wheel-verify/bin/omerta check > /tmp/smoke.txt 2>&1; status=$?; set -e
          cat /tmp/smoke.txt
          test "$status" -eq 1
          grep -qx 'app.py:1: API_KEY (from .env)' /tmp/smoke.txt
          if grep -q sk-smoke /tmp/smoke.txt; then echo "::error::omerta printed the value"; exit 1; fi

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # the OIDC token of PyPI's trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        # 1.14.3 uploads with a certifi that no longer trusts the compromised
        # emSign CAs.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # A tag push and a main push at the same SHA produce two CI runs and
          # thus two publish runs; the concurrency group cancels the one that
          # runs while the other does, and skip-existing makes the upload of
          # the later one a no-op rather than a hard failure.
          skip-existing: true

  # The GitHub release of the tag, named after it, with the notes that the
  # build job wrote. This job holds a token that can write the repository, so,
  # as the coverage badge's job in ci.yml, it runs no code of the project or of
  # its dependencies, and checks nothing out: gh is the runner's own. The
  # second publish run of a release finds the release made and leaves it.
  release:
    needs: [publish-gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # to create the GitHub release

    steps:
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish-gate.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The release $TAG exists — skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
