name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# The publish workflow (.github/workflows/publish.yml) runs after each CI
# run, and publishes a commit of main that a v* tag points at. A release's
# push to main and its tag start two CI runs, and either can publish it; the
# publish workflow's concurrency group cancels the duplicate.

# Checkouts leave no token in .git/config (persist-credentials: false): the
# steps after them run the code of the dependencies.
permissions:
  contents: read

env:
  # 0.13.4 is younger than the week of the cooldown, and fixes the CA store
  # of 0.13.0 to 0.13.3 (GHSA-hq85-5cpj-mr62).
  UV_VERSION: "0.13.4"
  # The SHA-256 of its uv-x86_64-unknown-linux-gnu.tar.gz, which setup-uv
  # checks the Linux jobs' download against: it knows the checksums of the uv
  # releases before its own only, and takes the others from a list it fetches
  # as it runs. A new UV_VERSION fails there until this follows it. The test
  # matrix, which holds no secret, keeps setup-uv's own check.
  UV_LINUX_X64_SHA256: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_LINUX_X64_SHA256 }}

      - name: Set up Python from .python-version
        run: uv python install

      # --locked: fail when uv.lock does not match pyproject.toml, where a
      # plain sync would resolve again and run other versions of the tools.
      - name: Install dependencies
        run: uv sync --locked

      # markdownlint, at the version of package-lock.json, on the runner's Node
      # (no install scripts: .npmrc).
      - name: Install the development tools of package.json
        run: npm ci --no-audit --no-fund

      # Without the check of advisories, which fails on an advisory of the
      # day, whatever the commit: advisories.yml runs it daily for the
      # package's own dependencies. With the checks of the licences and of
      # the wheels, which the publish workflow then waits for.
      - name: Run pre-commit checks (ruff, ty, bandit, interrogate, licenseal, wheels, markdownlint, omerta)
        run: uv run pre-commit run --all-files
        env:
          SKIP: advisories

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The coverage of the one cell that measures it, for the badge: the other
    # cells leave the output empty, which does not override it.
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    env:
      # .python-version pins the development interpreter. Without this, a
      # plain `uv run` rebuilds the environment on that pin, and every cell
      # of the matrix tests the same Python.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      # Fails the cell when .python-version, not the matrix, chose the
      # interpreter the tests run on.
      - name: Check the tests run on Python ${{ matrix.python-version }}
        run: uv run python -c "import sys; found = '%d.%d' % sys.version_info[:2]; assert found == '${{ matrix.python-version }}', found"

      - name: Show the git the tests run with
        run: git --version

      - name: Run tests with coverage
        run: uv run pytest -n auto --cov=omerta --cov-report=xml --cov-report=term-missing --cov-fail-under=100

      - name: Extract coverage percentage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        id: coverage
        run: |
          RATE=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('coverage.xml').getroot().get('line-rate'))")
          PCT=$(python3 -c "print(round(float('$RATE') * 100))")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

  # The coverage badge, on main: in a job of its own, which runs no code of the
  # project or of its dependencies, so that the gist token is never in a job
  # with them, where a step can leave code for a later step's action to run
  # (NODE_OPTIONS in GITHUB_ENV, a file of the action).
  coverage-badge:
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the coverage percentage
        env:
          PCT: ${{ needs.test.outputs.coverage }}
        run: |
          if ! [[ "$PCT" =~ ^[0-9]{1,3}$ ]]; then
            echo "::error::The test job gave no coverage percentage."
            exit 1
          fi

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: omerta-coverage.json
          label: coverage
          message: ${{ needs.test.outputs.coverage }}%
          valColorRange: ${{ needs.test.outputs.coverage }}
          minColorRange: 50
          maxColorRange: 100

  # The one check that the branch ruleset requires of a pull request, so that
  # a change to the matrix never leaves it waiting for a job that is gone. It
  # runs whatever the jobs before it did, as a skipped required check counts as
  # passed, and passes only when each of them passed (a matrix job's result is
  # that of all its cells). The badge, which runs on main only, after a merge,
  # is not among them; the run, which the publish workflow waits for, still
  # fails with it.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every job passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, test: $TEST"
          [ "$LINT" = success ] && [ "$TEST" = success ]
